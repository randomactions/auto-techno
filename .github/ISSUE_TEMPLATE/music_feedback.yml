name: Sound-quality feedback
description: Share an optional concrete observation that can become a measurable engine hypothesis.
title: "[Quality] "
labels:
  - musical-feedback
body:
  - type: markdown
    attributes:
      value: |
        Describe what you heard and where it occurred. Feedback is hypothesis input, not an approval vote. Do not upload copyrighted reference audio, private fixture state, personal information, or unsanitized logs.
  - type: input
    id: revision
    attributes:
      label: Auto Techno revision
      description: Enter the commit SHA or release without a local filesystem path.
      placeholder: "For example: d63a04a"
    validations:
      required: true
  - type: input
    id: quality_policy
    attributes:
      label: Quality-policy version
      description: Include the report or policy version when visible; otherwise write "Unknown".
      placeholder: "Unknown"
    validations:
      required: true
  - type: input
    id: checkpoint
    attributes:
      label: Structural checkpoint
      description: Name the phrase/bar region or state, such as establishment, contrast, break, release, or identity return.
      placeholder: "For example: first contrast, phrase 3 bar 7"
    validations:
      required: true
  - type: dropdown
    id: dimension
    attributes:
      label: Affected quality dimension
      options:
        - Groove or intentional space
        - Timbral identity or sound design
        - Low end or role hierarchy
        - Transients or dynamics
        - Spectrum or masking
        - Stereo depth or mono translation
        - Tension or long-form structure
        - Artifact, click, tail, or instability
        - Other
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Concrete observation
      description: Describe the audible deficit without prescribing a raw DSP control.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected perceptible result
      description: State what should become observably different and what should remain unchanged.
    validations:
      required: true
  - type: textarea
    id: automated_evidence
    attributes:
      label: Existing automated evidence
      description: Add sanitized reason codes or report summaries when available. Do not include local paths or private fixture values.
  - type: dropdown
    id: environment
    attributes:
      label: Optional listening environment
      options:
        - Not provided
        - Headphones
        - Speakers
        - Both
        - Other
