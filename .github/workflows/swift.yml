name: Swift CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: swift-test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Swift toolchain
        run: swift --version

      # Swift Testing retains substantial render fixtures for the lifetime of
      # one test process on the hosted macOS runner. Keep execution serial and
      # restart the process between the three PCM-heavy suites so the complete
      # test bank stays bounded without skipping or weakening any case.
      - name: Run core and evidence tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(AdaptiveAutonomousSessionTests|GeneratedDSPTopologyTests|AutonomousCandidateEvaluationTests|BS1770AudioEvidenceTests|CurrentRuntimeTests|RepositorySurfaceTests|IdentityReturnContinuationTests|QualityQualificationFoundationTests|SpectrumMaskingAnalyzerTests|UpperTimbreDSPTests|UpperTimbrePlanningTests)'

      - name: Run preparation preflight tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter AutonomousPreparationPreflightTests

      - name: Run protected-routing regression tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter SpatialProtectedRoutingRegressionTests

      - name: Run upper-timbre integration tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter UpperTimbreIntegrationTests

      - name: Build release app
        run: swift build -c release --product AutoTechno --build-path "$RUNNER_TEMP/auto-techno-release"
