name: Swift CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: swift-test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Swift toolchain
        run: swift --version

      # Swift Testing retains substantial render fixtures for the lifetime of
      # one test process on the hosted macOS runner. Keep execution serial and
      # restart the process at every prepared-product boundary so the complete
      # upper bank stays bounded without skipping or weakening any case. The
      # first group compiles the test binary; every later group reuses it.
      - name: Build tests and run upper score slices
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(localizedVerticalSlicePCM|upperTimingCascadeVerticalSlice|scoreVelocityVerticalSlice)'

      - name: Run atomic prepared continuation
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter atomicPreparedContinuation

      - name: Run lightweight upper contracts
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(boundedCandidateSelection|closedHatDecayPlanFingerprint|boundedPreparationInputs|conservativeFallbackGrooveCellIsCanonical)'

      - name: Run 8 kHz closed-hat route preparation
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter closedHatCompanion8KRoutePreparation

      - name: Run 12 kHz closed-hat route preparation
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter closedHatCompanion12KRoutePreparation

      - name: Run closed-hat evidence tampering
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter closedHatCompanionRenderEvidenceTampering

      - name: Run pulse-echo evidence tampering
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter pulseEchoReturnBindingTampering

      - name: Run paired evaluator transaction
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter pairedEvaluatorTransaction

      - name: Run candidate-boundary cancellation
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter candidateBoundaryCancellation

      - name: Run paired correction order
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter pairedCorrectionOrder

      - name: Run rejected-candidate isolation
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter rejectedCandidateIsolation

      - name: Run representative-rate intent
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter representativeRateIntent

      - name: Run equivalent prepared transactions across rates
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter equivalentPreparedTransactionsAcrossRates

      - name: Run phrase-boundary evidence
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter phraseBoundaryEvidence

      - name: Run core and evidence tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(AdaptiveAutonomousSessionTests|GeneratedDSPTopologyTests|AutonomousCandidateEvaluationTests|BS1770AudioEvidenceTests|CurrentRuntimeTests|FeedbackDelayNetworkTests|RepositorySurfaceTests|IdentityReturnContinuationTests|InstrumentPaletteTests|KickSyntaxTests|PercussionEchoTextureTests|PhraseCompositionTests|ProfessionalQualityCalibration|QualityQualificationFoundationTests|SpectrumMaskingAnalyzerTests|StreamingPerceptualEvidenceTests|UpperTimbreDSPTests|UpperTimbrePlanningTests)'

      - name: Run preparation preflight tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter AutonomousPreparationPreflightTests

      - name: Run protected-routing regression tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter SpatialProtectedRoutingRegressionTests

      - name: Build release app
        run: swift build -c release --product AutoTechno --build-path "$RUNNER_TEMP/auto-techno-release"
