name: Swift CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-gates:
    name: swift-gates (${{ matrix.bank }})
    runs-on: macos-15
    # The unchanged serial bank exceeded the hosted six-hour job ceiling.
    # Each bank retains serial test execution and builds its own exact source.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        bank: [foundation, primary, modal, remaining]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show Swift toolchain
        run: swift --version

      - name: Verify fresh and retained capture provenance
        if: matrix.bank == 'foundation'
        working-directory: scripts
        run: >-
          python3 -m unittest
          test_baseline_capture_scope
          test_baseline_capture_transaction
          test_baseline_dependency_contract
          test_baseline_producer_capture_driver
          test_baseline_producer_witness
          test_baseline_retained_capture
          test_baseline_validation_session
          test_lifecycle_retained_scope
          test_phase_one_gate
          test_tracked_derived_capture
          test_baseline_lifecycle_policy
          test_baseline_render_manifest
          test_stem_capture_manifest
          test_authority_surface_inventory

      - name: Verify Release producer witness and actual initialization
        if: matrix.bank == 'foundation'
        env:
          AUTOTECHNO_RUN_PRODUCER_WITNESS_PROBE: '1'
          AUTOTECHNO_PRODUCER_WITNESS_PROBE_OUTPUT: docs/local/reports/ci-producer-probe.json
        run: |
          swift test -c release --no-parallel \
            --build-path "$RUNNER_TEMP/auto-techno-provenance-release" \
            --filter BaselineProducerWitnessTests
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          import baseline_producer_witness as witness

          root = Path.cwd()
          probe = json.loads((root / "docs/local/reports/ci-producer-probe.json").read_text())
          witness.validate_probe(root, probe,
              image=Path(probe["compiledImagePath"]), corpus_name="docs/BASELINE_CORPUS.json")
          source = (root / "Sources/AutoTechnoCore/QualityQualification.swift").read_text()
          version = re.search(r'engineVersion\s*=\s*"([^"]+)"', source)
          if version is None or probe["engineVersion"] != version.group(1):
              raise SystemExit("actual producer engine differs from the source contract")
          print("Actual Release image and complete public initialization ledger verified; no capture currency or promotion.")
          PY

      # Swift Testing retains substantial render fixtures for the lifetime of
      # one test process on the hosted macOS runner. Keep execution serial and
      # restart the process at every prepared-product boundary so the complete
      # upper bank stays bounded without skipping or weakening any case. The
      # first group compiles the test binary; every later group reuses it.
      - name: Build tests and run upper score slices
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(localizedVerticalSlicePCM|upperTimingCascadeVerticalSlice|scoreVelocityVerticalSlice)'

      # Capture the known crashing fixtures before the long qualification bank.
      # Preflight also exited signal 10 after the percussion repairs passed.
      # The original core and preflight groups retain their full coverage.
      - name: Run percussion and preflight diagnostic checkpoints
        if: matrix.bank == 'foundation'
        timeout-minutes: 10
        run: |
          test_status=0
          swift test --no-parallel --skip-build \
            --build-path "$RUNNER_TEMP/auto-techno-tests" \
            --filter '(PercussionEchoTextureTests|AutonomousPreparationPreflightTests/preflightRejectsMissingDuplicateReorderedAndForgedModalArticulations)' || test_status=$?
          if [ "$test_status" -ne 0 ]; then
            test_binary_directory="$(swift build \
              --build-path "$RUNNER_TEMP/auto-techno-tests" --show-bin-path)"
            test_binary="$test_binary_directory/AutoTechnoPackageTests.xctest/Contents/MacOS/AutoTechnoPackageTests"
            swift_compiler="$(xcrun --find swift)"
            test_helper="$(dirname "$swift_compiler")/../libexec/swift/pm/swiftpm-testing-helper"
            sdk_platform="$(xcrun --sdk macosx --show-sdk-platform-path)"
            diagnostic_framework_path="${DYLD_FRAMEWORK_PATH:+$DYLD_FRAMEWORK_PATH:}$sdk_platform/Developer/Library/Frameworks:$sdk_platform/Developer/Library/PrivateFrameworks"
            diagnostic_library_path="${DYLD_LIBRARY_PATH:+$DYLD_LIBRARY_PATH:}$sdk_platform/Developer/usr/lib"
            # One replay for crash evidence only; retain the normal gate's
            # failure and never load debugger initialization or dump variables.
            # Pass the literal filter directly; shell expansion invokes argdumper.
            xcrun lldb --batch --no-lldbinit \
              -o "settings set target.env-vars 'DYLD_FRAMEWORK_PATH=$diagnostic_framework_path' 'DYLD_LIBRARY_PATH=$diagnostic_library_path'" \
              -o 'process launch --shell-expand-args false' \
              -k 'thread backtrace --count 40 all' \
              -k 'register read sp fp pc x9' \
              -k 'memory region $sp' \
              -k 'disassemble --frame --count 12' \
              -k 'frame select 1' \
              -k 'disassemble --frame --count 24' \
              -- "$test_helper" --test-bundle-path "$test_binary" \
              --no-parallel --filter '(PercussionEchoTextureTests|AutonomousPreparationPreflightTests/preflightRejectsMissingDuplicateReorderedAndForgedModalArticulations)' \
              "$test_binary" --testing-library swift-testing || true
          fi
          exit "$test_status"

      # Keep the previously crashing correction gate near the build so a
      # recurrence yields diagnostics before the long evidence bank runs.
      - name: Run single correction order
        if: matrix.bank == 'foundation'
        run: |
          test_status=0
          swift test --no-parallel --skip-build \
            --build-path "$RUNNER_TEMP/auto-techno-tests" \
            --filter onePrimaryCorrection || test_status=$?
          if [ "$test_status" -ne 0 ]; then
            test_binary_directory="$(swift build \
              --build-path "$RUNNER_TEMP/auto-techno-tests" --show-bin-path)"
            test_binary="$test_binary_directory/AutoTechnoPackageTests.xctest/Contents/MacOS/AutoTechnoPackageTests"
            swift_compiler="$(xcrun --find swift)"
            test_helper="$(dirname "$swift_compiler")/../libexec/swift/pm/swiftpm-testing-helper"
            sdk_platform="$(xcrun --sdk macosx --show-sdk-platform-path)"
            diagnostic_framework_path="${DYLD_FRAMEWORK_PATH:+$DYLD_FRAMEWORK_PATH:}$sdk_platform/Developer/Library/Frameworks:$sdk_platform/Developer/Library/PrivateFrameworks"
            diagnostic_library_path="${DYLD_LIBRARY_PATH:+$DYLD_LIBRARY_PATH:}$sdk_platform/Developer/usr/lib"
            # One diagnostic replay only. Its result never replaces the failed
            # gate above; no initialization files or variable dumps are loaded.
            xcrun lldb --batch --no-lldbinit \
              -o "settings set target.env-vars 'DYLD_FRAMEWORK_PATH=$diagnostic_framework_path' 'DYLD_LIBRARY_PATH=$diagnostic_library_path'" \
              -o run \
              -k 'thread backtrace --count 40 all' \
              -k 'register read sp fp pc x9' \
              -k 'memory region $sp' \
              -k 'disassemble --frame --count 12' \
              -k 'frame select 1' \
              -k 'disassemble --frame --count 24' \
              -- "$test_helper" --test-bundle-path "$test_binary" \
              --no-parallel --filter onePrimaryCorrection \
              "$test_binary" --testing-library swift-testing || true
          fi
          exit "$test_status"

      - name: Verify semantic codebase map
        if: matrix.bank == 'foundation'
        run: |
          python3 -m unittest scripts/test_codebase_map.py
          python3 scripts/codebase_map.py check \
            --build-path "$RUNNER_TEMP/auto-techno-tests"

      - name: Verify component licences and governed assets
        if: matrix.bank == 'foundation'
        run: |
          python3 -m unittest scripts/test_component_license_asset_manifest.py
          python3 -m unittest scripts/test_local_artifact_doctor.py
          python3 scripts/component_license_asset_manifest.py check

      - name: Verify result status vocabulary
        if: matrix.bank == 'foundation'
        run: |
          python3 -m unittest scripts/test_result_status_vocabulary.py
          python3 -m unittest scripts/test_controlled_listening_protocol.py
          python3 -m unittest scripts/test_baseline_lifecycle_policy.py
          python3 -m unittest scripts/test_deficit_register.py
          python3 -m unittest scripts/test_performance_envelope_report.py
          python3 -m unittest scripts/test_roadmap_integrity.py
          python3 -m unittest scripts/test_source_citation_records.py
          python3 -m unittest scripts/test_negative_result_records.py
          python3 -m unittest scripts/test_phase_zero_gate.py
          python3 -m unittest scripts/test_phase_one_gate.py
          python3 -m unittest scripts/test_baseline_validation_session.py
          python3 -m unittest scripts/test_baseline_corpus.py
          python3 -m unittest scripts/test_baseline_render_manifest.py
          python3 -m unittest scripts/test_stem_capture_manifest.py
          python3 -m unittest scripts/test_pcm_comparison_report.py
          python3 -m unittest scripts/test_signal_baseline_report.py
          python3 -m unittest scripts/test_spectral_baseline_report.py
          python3 -m unittest scripts/test_kick_foundation_collision_report.py
          python3 -m unittest scripts/test_transient_envelope_baseline_report.py
          python3 -m unittest scripts/test_section_boundary_baseline_report.py
          python3 -m unittest scripts/test_session_trajectory_baseline_report.py
          python3 scripts/result_status_vocabulary.py check
          python3 scripts/controlled_listening_protocol.py check
          python3 scripts/baseline_lifecycle_policy.py validate
          python3 scripts/deficit_register.py validate
          python3 scripts/source_citation_records.py check
          python3 scripts/negative_result_records.py check
          python3 scripts/baseline_corpus.py check
          python3 scripts/phase_one_gate.py validate

      - name: Run detached role-stem capture contracts
        if: matrix.bank == 'foundation'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(RoleStemCaptureTests|StemCaptureIntegrationTests|PCMSignalIntegrityAnalyzerTests|SignalBaselineIntegrationTests|PCMSpectralBaselineAnalyzerTests|SpectralBaselineIntegrationTests|PCMKickFoundationCollisionAnalyzerTests|KickFoundationCollisionIntegrationTests|PCMTransientEnvelopeAnalyzerTests|TransientEnvelopeBaselineIntegrationTests)'

      - name: Run realtime queue and callback safety
        if: matrix.bank == 'foundation'
        run: |
          swift test --no-parallel --skip-build \
            --build-path "$RUNNER_TEMP/auto-techno-tests" \
            --filter LivePCMQueueTests
          producer_objects="$(find "$RUNNER_TEMP/auto-techno-tests" \
            -type f -name 'CAutoTechnoRealtimeProducer.c.o' -print)"
          producer_object_count="$(printf '%s\n' "$producer_objects" | \
            awk 'NF { count += 1 } END { print count + 0 }')"
          test "$producer_object_count" -eq 1
          producer_object="$producer_objects"
          test -s "$producer_object"

          normalize_symbols() {
            awk 'NF { symbol = $NF; sub(/^_+/, "", symbol); if (symbol != "") print symbol }'
          }
          unexpected_symbols() {
            awk '$0 != "memcpy" && $0 != "memcpy_chk"'
          }
          normalization_self_test="$(printf '%s\n' '_memcpy' '___memcpy_chk' | \
            normalize_symbols | LC_ALL=C sort -u | tr '\n' ' ')"
          test "$normalization_self_test" = 'memcpy memcpy_chk '
          rejection_self_test="$(printf '%s\n' '_malloc' | \
            normalize_symbols | unexpected_symbols)"
          test "$rejection_self_test" = 'malloc'
          empty_object_self_test="$(printf '\n' | \
            awk 'NF { count += 1 } END { print count + 0 }')"
          test "$empty_object_self_test" -eq 0

          undefined_symbols="$(nm -u "$producer_object" | \
            normalize_symbols | LC_ALL=C sort -u)"
          test -n "$undefined_symbols"
          unexpected="$(printf '%s\n' "$undefined_symbols" | \
            unexpected_symbols)"
          if test -n "$unexpected"; then
            echo "unexpected callback dependencies:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run live analyzer controller and terminal trim
        if: matrix.bank == 'foundation'
        run: |
          swift test --no-parallel --skip-build \
            --build-path "$RUNNER_TEMP/auto-techno-tests" \
            --filter '(LiveOutputWindowEvidenceTests|LiveMasterHeadroomControllerTests|LiveMasterTrimRenderingTests|BS1770AudioEvidenceTests)'
          swift test --no-parallel --skip-build \
            --build-path "$RUNNER_TEMP/auto-techno-tests" \
            --filter LiveMasterTrimFingerprintTests

      - name: Run App live-feedback coordination
        if: matrix.bank == 'foundation'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(LiveFeedbackCoordinatorTests|TechnoEngineLiveFeedbackTests|AutonomousSessionIdentityTests|LiveRenderInspectorTests)'

      - name: Run persistent continuous journey controls
        if: matrix.bank == 'foundation'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter continuousJourneyExecution

      - name: Run candidate evidence and live tampering
        if: matrix.bank == 'foundation'
        run: |
          test_status=0
          swift test --no-parallel --skip-build \
            --build-path "$RUNNER_TEMP/auto-techno-tests" \
            --filter '(AutonomousCandidateEvaluationTests|adversarialLiveOccurrenceTimelineRejectsMutations)' || test_status=$?
          if [ "$test_status" -ne 0 ]; then
            test_binary_directory="$(swift build \
              --build-path "$RUNNER_TEMP/auto-techno-tests" --show-bin-path)"
            test_binary="$test_binary_directory/AutoTechnoPackageTests.xctest/Contents/MacOS/AutoTechnoPackageTests"
            swift_compiler="$(xcrun --find swift)"
            test_helper="$(dirname "$swift_compiler")/../libexec/swift/pm/swiftpm-testing-helper"
            sdk_platform="$(xcrun --sdk macosx --show-sdk-platform-path)"
            diagnostic_framework_path="${DYLD_FRAMEWORK_PATH:+$DYLD_FRAMEWORK_PATH:}$sdk_platform/Developer/Library/Frameworks:$sdk_platform/Developer/Library/PrivateFrameworks"
            diagnostic_library_path="${DYLD_LIBRARY_PATH:+$DYLD_LIBRARY_PATH:}$sdk_platform/Developer/usr/lib"
            # One replay for crash evidence only; retain the normal gate's
            # failure and never load debugger initialization or dump variables.
            # Pass the literal filter directly; shell expansion invokes argdumper.
            xcrun lldb --batch --no-lldbinit \
              -o "settings set target.env-vars 'DYLD_FRAMEWORK_PATH=$diagnostic_framework_path' 'DYLD_LIBRARY_PATH=$diagnostic_library_path'" \
              -o 'process launch --shell-expand-args false' \
              -k 'thread backtrace --count 40 all' \
              -k 'register read sp fp pc x9' \
              -k 'memory region $sp' \
              -k 'disassemble --frame --count 12' \
              -k 'frame select 1' \
              -k 'disassemble --frame --count 24' \
              -- "$test_helper" --test-bundle-path "$test_binary" \
              --no-parallel --filter '(AutonomousCandidateEvaluationTests|adversarialLiveOccurrenceTimelineRejectsMutations)' \
              "$test_binary" --testing-library swift-testing || true
          fi
          exit "$test_status"

      - name: Run exact primary artifacts and legacy rejection
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(harmonicTailPrimaryIdentityContract|primaryResourcesAreV14Only|bundledV14ArtifactsAreReady|primaryArtifacts|legacyPolicyJSONIsRejected|serializedLiveObservationProvenanceIsRejected|generateRepresentativeProfile|calibrationCacheRejectsSwappedOrUnboundedBanks|RepositorySurfaceTests)'

      - name: Run primary calibration adversarial challenge
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(deterministicProfile|adversarialSuite)'

      - name: Run primary calibrated-policy contracts
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(modalMetricContract|noAggregateCompensation|directionalSafetyBounds|descriptiveLoudnessRange|rmsTrajectoryRateConsistency|primaryCandidatePolicy|liveMasterProvenanceHardGates|diverseCorpusIdentity|preparationEvaluatorAvailability|invalidCalibrationInputs|modalEvidencePrecedesPrimaryPolicy)'

      - name: Run disjoint primary holdout qualification
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter holdoutDisjointnessAndAcceptance

      - name: Run atomic primary commit
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter calibratedPrimaryCommit

      - name: Run lightweight primary and evidence contracts
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(primaryCandidatePolicy|preparationEvaluatorAvailability|closedHatEvidenceContract|failedAttemptIsRetainable)'

      - name: Run 8 kHz primary unavailability gate
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter unsupported8KRouteStaysUnavailable

      - name: Run 12 kHz primary unavailability gate
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter unsupported12KRouteStaysUnavailable

      - name: Run closed-hat evidence tampering
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter closedHatEvidenceContract

      - name: Run pulse-echo evidence tampering
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter pulseEchoDriveEvidenceContract

      - name: Run modal-percussion evidence tampering
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter 'modalPercussionRejects'

      - name: Run unavailable-route commit gate
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter unavailableRouteDoesNotCommit

      - name: Run primary-boundary cancellation
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter primaryBoundaryCancellation

      - name: Run rejected-attempt isolation
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter failedAttemptIsRetainable

      - name: Run representative-rate intent
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter representativeRateEquivalence

      - name: Run modal-percussion representative-rate decay
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter physicalDecayMatchesAt44100And48000

      - name: Run modal-percussion correction equality
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter modalPercussionCorrectionMustMatchInitial

      - name: Run equivalent prepared transactions across rates
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter deviceSampleRates

      - name: Run primary-preparation resource envelope
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(representativeRateWorkingSetEnvelope|missingArtifactsStayUnavailable)'

      - name: Run phrase-boundary evidence
        if: matrix.bank == 'primary'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter rendererContinuationReplay

      - name: Run modal-percussion core suites
        if: matrix.bank == 'modal'
        run: |
          test_status=0
          swift test --no-parallel --skip-build \
            --build-path "$RUNNER_TEMP/auto-techno-tests" \
            --filter '(ModalPercussionDSPTests|ModalPercussionPlanningTests|ModalSuccessorReportJoinTests)' || test_status=$?
          if [ "$test_status" -ne 0 ]; then
            test_binary_directory="$(swift build \
              --build-path "$RUNNER_TEMP/auto-techno-tests" --show-bin-path)"
            test_binary="$test_binary_directory/AutoTechnoPackageTests.xctest/Contents/MacOS/AutoTechnoPackageTests"
            swift_compiler="$(xcrun --find swift)"
            test_helper="$(dirname "$swift_compiler")/../libexec/swift/pm/swiftpm-testing-helper"
            sdk_platform="$(xcrun --sdk macosx --show-sdk-platform-path)"
            diagnostic_framework_path="${DYLD_FRAMEWORK_PATH:+$DYLD_FRAMEWORK_PATH:}$sdk_platform/Developer/Library/Frameworks:$sdk_platform/Developer/Library/PrivateFrameworks"
            diagnostic_library_path="${DYLD_LIBRARY_PATH:+$DYLD_LIBRARY_PATH:}$sdk_platform/Developer/usr/lib"
            # One replay for crash evidence only; retain the normal gate's
            # failure and never load debugger initialization or dump variables.
            # Pass the literal filter directly; shell expansion invokes argdumper.
            xcrun lldb --batch --no-lldbinit \
              -o "settings set target.env-vars 'DYLD_FRAMEWORK_PATH=$diagnostic_framework_path' 'DYLD_LIBRARY_PATH=$diagnostic_library_path'" \
              -o 'process launch --shell-expand-args false' \
              -k 'thread backtrace --count 40 all' \
              -k 'register read sp fp pc x9' \
              -k 'memory region $sp' \
              -k 'disassemble --frame --count 12' \
              -k 'frame select 1' \
              -k 'disassemble --frame --count 24' \
              -- "$test_helper" --test-bundle-path "$test_binary" \
              --no-parallel --filter '(ModalPercussionDSPTests|ModalPercussionPlanningTests|ModalSuccessorReportJoinTests)' \
              "$test_binary" --testing-library swift-testing || true
          fi
          exit "$test_status"

      - name: Run measurement fixture and provenance controls
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(DeterministicSignalFixturesTests|AT0039FoundationCohortSelectionTests|AutonomousEvidenceAuthorityTests)'

      - name: Run adaptive autonomous-session suite
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter AdaptiveAutonomousSessionTests

      - name: Run lightweight instrument palette tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter 'InstrumentPaletteTests.(catalogContract|correctionHomeContract|foundationBehaviorPCM|architectureAutomationPCM|resonantMonoAcidRelations|spectralTextureRisingCluster|spectralTextureUpperHarmonicTailAssignment|spectralTextureUpperHarmonicTailDSP|tonalTailContinuation|tonalPatchBoundary)'

      - name: Run instrument renderer evidence
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter InstrumentPaletteTests.canonicalRendererEvidence

      - name: Run canonical acid relation evidence
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter InstrumentPaletteTests.canonicalAcidRelationEvidence

      - name: Run prepared spectral-cluster evidence
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter InstrumentPalettePreparedEvidenceTests.testPreparedSpectralClusterEvidence

      - name: Run prepared upper harmonic-tail evidence
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter InstrumentPalettePreparedEvidenceTests.testPreparedHarmonicTailEvidence

      - name: Run prepared acid-relation evidence
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter InstrumentPalettePreparedEvidenceTests.testPreparedAcidRelationEvidence

      - name: Run kick source dynamics tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter KickSourceDynamicsTests

      - name: Run prepared percussion-echo evidence
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter PercussionEchoTexturePreparedEvidenceTests.testPreparedProductEvidence

      - name: Run core and evidence tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(ClimaxHangTests|FoundationRhythmicRelationTests|GeneratedDSPTopologyTests|FeedbackDelayNetworkTests|IdentityReturnContinuationTests|KickSyntaxTests|PercussionEchoTextureTests|PhraseCompositionTests|QualityQualificationFoundationTests|SpectrumMaskingAnalyzerTests|StreamingPerceptualEvidenceTests|TPTAntialiasedNonlinearCoreTests|fixedSessionIdentity|currentPlanningIsDeterministic)'

      - name: Run upper-percussion tail DSP tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter UpperPercussionTailDSPTests

      - name: Run upper-percussion tail score tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter UpperPercussionTailTests

      - name: Run upper spectral-reveal DSP tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter UpperSpectralRevealDSPTests

      - name: Run upper spectral-reveal score tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter UpperSpectralRevealTests

      - name: Run upper-timbre DSP tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter UpperTimbreDSPTests

      - name: Run upper-timbre planning tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter UpperTimbrePlanningTests

      - name: Run preparation preflight tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter AutonomousPreparationPreflightTests

      - name: Run protected-routing regression tests
        if: matrix.bank == 'remaining'
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter SpatialProtectedRoutingRegressionTests

      - name: Build release app
        if: matrix.bank == 'remaining'
        run: swift build -c release --product AutoTechno --build-path "$RUNNER_TEMP/auto-techno-release"

      - name: Summarize test crash diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          directory = Path.home() / "Library/Logs/DiagnosticReports"
          reports = sorted(directory.glob("*.ips"), key=lambda p: p.stat().st_mtime)
          emitted = 0
          for path in reversed(reports):
              if emitted >= 3:
                  break
              try:
                  text = path.read_text()
                  # Apple IPS uses one metadata object followed by the report.
                  decoder = json.JSONDecoder()
                  first, end = decoder.raw_decode(text.lstrip())
                  remainder = text.lstrip()[end:].strip()
                  report = decoder.raw_decode(remainder)[0] if remainder else first
                  if report.get("procName") not in (
                      "AutoTechnoPackageTests", "swiftpm-testing-helper", "xctest"
                  ):
                      continue
                  summary = {
                      "process": report.get("procName"),
                      "cpuType": report.get("cpuType"),
                      "osVersion": report.get("osVersion"),
                      "exception": report.get("exception"),
                      "termination": report.get("termination"),
                      "vmRegionInfo": report.get("vmRegionInfo"),
                      "faultingThread": report.get("faultingThread"),
                      "triggeredThreads": [
                          {"name": thread.get("name"), "frames": thread.get("frames", [])[:40]}
                          for thread in report.get("threads", []) if thread.get("triggered")
                      ],
                  }
                  print(json.dumps(summary, indent=2))
                  emitted += 1
              except (OSError, ValueError, TypeError, AttributeError) as error:
                  print("Crash report could not be summarized:", type(error).__name__)
          if not emitted:
              print("No matching test crash report available; absence does not establish a cause.")
          PY

  swift-test:
    name: swift-test
    runs-on: ubuntu-latest
    needs: swift-gates
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every Swift bank to succeed
        env:
          SWIFT_GATES_RESULT: ${{ needs.swift-gates.result }}
        run: test "$SWIFT_GATES_RESULT" = success
