name: Swift CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: swift-test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Swift toolchain
        run: swift --version

      # Swift Testing retains substantial render fixtures for the lifetime of
      # one test process on the hosted macOS runner. Keep execution serial and
      # restart the process between PCM-heavy groups so the complete test bank
      # stays bounded without skipping or weakening any case. The two route-rate
      # products each receive their own process while reusing the compiled tests.
      - name: Run upper-timbre integration tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter UpperTimbreIntegrationTests
          --skip 'closedHatCompanion(8K|12K)RoutePreparation'

      - name: Run 8 kHz closed-hat route preparation
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter closedHatCompanion8KRoutePreparation

      - name: Run 12 kHz closed-hat route preparation
        run: >-
          swift test --no-parallel --skip-build
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter closedHatCompanion12KRoutePreparation

      - name: Run core and evidence tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter '(AdaptiveAutonomousSessionTests|GeneratedDSPTopologyTests|AutonomousCandidateEvaluationTests|BS1770AudioEvidenceTests|CurrentRuntimeTests|RepositorySurfaceTests|IdentityReturnContinuationTests|InstrumentPaletteTests|QualityQualificationFoundationTests|SpectrumMaskingAnalyzerTests|UpperTimbreDSPTests|UpperTimbrePlanningTests)'

      - name: Run preparation preflight tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter AutonomousPreparationPreflightTests

      - name: Run protected-routing regression tests
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-tests"
          --filter SpatialProtectedRoutingRegressionTests

      - name: Build release app
        run: swift build -c release --product AutoTechno --build-path "$RUNNER_TEMP/auto-techno-release"
