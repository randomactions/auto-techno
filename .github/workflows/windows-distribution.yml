name: Windows Source Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-source-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-windows-source:
    name: Windows x64 source validation
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Swift 6.3.3
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --version 6.3.3 --source winget --accept-package-agreements --accept-source-agreements
          $swift = Get-ChildItem @("$env:ProgramFiles\Swift", "$env:LocalAppData\Programs\Swift") -Filter swift.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match "usr\\bin$" } |
            Select-Object -First 1
          if ($null -eq $swift) { throw "Unable to locate swift.exe after installation." }
          $swift.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain
        shell: pwsh
        run: swift --version

      - name: Build and test without distribution
        shell: pwsh
        run: .\scripts\build-windows.ps1
