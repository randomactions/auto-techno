name: Native Source Validation

on:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope (component runs do not replace full CI)
        type: choice
        required: true
        default: windows
        options:
          - windows
          - windows-diagnostics
          - modal-continuation
          - rumble-duration
          - foundation-timing
          - full-phrase-bass

permissions:
  contents: read

concurrency:
  group: native-source-validation-${{ github.ref }}-${{ inputs.validation }}
  cancel-in-progress: false

jobs:
  validate-windows-source:
    if: inputs.validation == 'windows' || inputs.validation == 'windows-diagnostics' || inputs.validation == ''
    name: Windows x64 source validation (${{ matrix.test-library }})
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test-library: ${{ fromJSON(inputs.validation == 'windows-diagnostics' && '["xctest","swift-testing"]' || '["all"]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Swift 6.3.3
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --version 6.3.3 --source winget --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Swift installation failed with exit code $LASTEXITCODE." }
          # The running Actions worker predates installation. Carry registered
          # runtime and toolchain paths into later steps, not only swift.exe's bin.
          $registeredPaths = foreach ($scope in @("Machine", "User")) {
            [Environment]::GetEnvironmentVariable("Path", $scope) -split ";" |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          }
          $registeredPaths | Select-Object -Unique |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $sdkRoot = [Environment]::GetEnvironmentVariable("SDKROOT", "User")
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) {
            $sdkRoot = [Environment]::GetEnvironmentVariable("SDKROOT", "Machine")
          }
          if (-not [string]::IsNullOrWhiteSpace($sdkRoot)) {
            "SDKROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Show toolchain
        shell: pwsh
        run: |
          $swift = Get-Command swift -CommandType Application -ErrorAction Stop
          Write-Host "Swift executable: $($swift.Source)"
          $versionOutput = & $swift.Source --version 2>&1
          $swiftExit = $LASTEXITCODE
          $versionOutput | Write-Output
          if ($swiftExit -ne 0) { throw "Swift startup failed with exit code $swiftExit." }
          if (($versionOutput -join "`n") -notmatch 'Swift version 6\.3\.3(?:\s|$)') {
            throw "The selected Swift executable does not match the pinned 6.3.3 toolchain."
          }

      - name: Build and test without distribution
        if: matrix.test-library == 'all'
        shell: pwsh
        run: .\scripts\build-windows.ps1

      # Diagnostic scopes do not replace the full source-validation command.
      # Separate framework discovery from compilation and a single execution so
      # a silent aggregate run cannot hide which boundary is still active.
      - name: Build diagnostic test executable
        if: matrix.test-library != 'all'
        timeout-minutes: 30
        shell: pwsh
        run: |
          swift build --build-tests --build-path .build-windows
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic test build failed." }

      - name: Discover selected test library
        if: matrix.test-library != 'all'
        timeout-minutes: 5
        shell: pwsh
        env:
          TEST_LIBRARY: ${{ matrix.test-library }}
        run: |
          $libraryArguments = if ($env:TEST_LIBRARY -eq "xctest") {
            @("--enable-xctest", "--disable-swift-testing")
          } else {
            @("--disable-xctest", "--enable-swift-testing")
          }
          swift test --build-path .build-windows list --skip-build @libraryArguments |
            Tee-Object -FilePath "test-discovery-$env:TEST_LIBRARY.txt"
          if ($LASTEXITCODE -ne 0) { throw "Test-library discovery failed." }
          $probe = if ($env:TEST_LIBRARY -eq "xctest") {
            'LiveMasterTrimFingerprintTests[/.]testTrimIsFingerprintBound'
          } else {
            'DeterministicSignalFixturesTests[/.]musicalRoleFixtureProperties'
          }
          if (-not (Select-String -Path "test-discovery-$env:TEST_LIBRARY.txt" -Pattern $probe -Quiet)) {
            throw "The declared diagnostic probe was not discovered."
          }

      - name: Execute discovered diagnostic probe
        if: matrix.test-library != 'all'
        timeout-minutes: 5
        shell: pwsh
        env:
          TEST_LIBRARY: ${{ matrix.test-library }}
        run: |
          $libraryArguments = if ($env:TEST_LIBRARY -eq "xctest") {
            @("--enable-xctest", "--disable-swift-testing", "--filter", "LiveMasterTrimFingerprintTests.testTrimIsFingerprintBound")
          } else {
            @("--disable-xctest", "--enable-swift-testing", "--filter", "DeterministicSignalFixturesTests.musicalRoleFixtureProperties")
          }
          swift test --build-path .build-windows --skip-build --no-parallel @libraryArguments
          if ($LASTEXITCODE -ne 0) { throw "The discovered diagnostic probe failed." }
          Write-Host "Diagnostic probe only; full Windows validation remains required."

      - name: Record diagnostic process state
        if: always() && matrix.test-library != 'all'
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -match 'swift|AutoTechno' } |
            Select-Object Id, ProcessName, CPU, WorkingSet64


  modal-continuation:
    if: inputs.validation == 'modal-continuation'
    name: Native modal continuation component
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record candidate and toolchain
        run: |
          git rev-parse HEAD
          swift --version
      # Focused research evidence only. This manual workflow neither supplies
      # the required swift-test check nor replaces the complete Swift CI banks.
      - name: Verify canonical continuation and fault controls
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-component"
          --filter '(algorithmicModalContinuationFaults|continuousModalWindowMatrix|continuousModalInterruptionAndBounds)'

  rumble-duration:
    if: inputs.validation == 'rumble-duration'
    name: Native rumble duration component
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record candidate and toolchain
        run: |
          git rev-parse HEAD
          swift --version
      - name: Verify canonical rumble duration and terminal controls
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-component"
          --filter SourceTerminalDeclickTests
      - name: Verify semantic codebase map
        run: python3 scripts/codebase_map.py check --build-path "$RUNNER_TEMP/auto-techno-component"

  foundation-timing:
    if: inputs.validation == 'foundation-timing'
    name: Native independent foundation timing component
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record candidate and toolchain
        run: |
          git rev-parse HEAD
          swift --version
      - name: Verify independent native bass timing and score faults
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-component"
          --filter algorithmicFoundationBassFaults
      - name: Verify semantic codebase map
        run: python3 scripts/codebase_map.py check --build-path "$RUNNER_TEMP/auto-techno-component"

  full-phrase-bass:
    if: inputs.validation == 'full-phrase-bass'
    name: Native full-phrase bass transaction fault
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record candidate and toolchain
        run: |
          git rev-parse HEAD
          swift --version
      - name: Verify full-phrase bass render and transaction binding
        run: >-
          swift test --no-parallel
          --build-path "$RUNNER_TEMP/auto-techno-component"
          --filter '(RenderFingerprintParityTests|algorithmicFullPhraseBassDeletion)'
      - name: Verify semantic codebase map
        run: python3 scripts/codebase_map.py check --build-path "$RUNNER_TEMP/auto-techno-component"
